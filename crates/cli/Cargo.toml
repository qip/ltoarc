[package]
name = "ltoarc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ltoarc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.19"
libc = "0.2.191"
ltoarc-catalog = { version = "0.1.0", path = "../catalog" }
ltoarc-device = { version = "0.1.0", path = "../device" }
ltoarc-engine = { version = "0.1.0", path = "../engine" }
ltoarc-format = { version = "0.1.0", path = "../format" }
ltoarc-fs = { version = "0.1.0", path = "../fs" }
ltoarc-scsi = { version = "0.1.0", path = "../scsi" }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.1.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
