[workspace]
resolver = "3"
members = ["crates/scsi", "crates/device", "crates/format", "crates/catalog", "crates/engine", "crates/fs", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 4
